[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "contextsmith"
version = "0.1.1"
description = "Give your coding agent the right code, not more code: a local context engine (code graph, hybrid search, embeddings, git history) that packs the best code for a task into a token budget, over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Sankhla" }]
keywords = ["mcp", "code-search", "rag", "context-engineering", "coding-agents", "tree-sitter", "embeddings", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.9",
    "typer>=0.15",
    "rich>=13.9",
    "mcp>=1.2",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.4", "sqlite-vec>=0.1.6", "numpy>=1.26"]
dev = ["pytest>=8.3", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/RahulSankhla312/contextsmith"
Issues = "https://github.com/RahulSankhla312/contextsmith/issues"
Benchmark = "https://github.com/RahulSankhla312/contextsmith#benchmark"

[project.scripts]
ctxsmith = "contextsmith.cli:main"
# `uvx contextsmith` (how MCP clients start PyPI servers) runs the MCP server.
contextsmith = "contextsmith.mcp_server:main"
contextsmith-mcp = "contextsmith.mcp_server:main"

[tool.setuptools.packages.find]
include = ["contextsmith*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM108", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  semantic:
    # The embedding layer, with real ONNX models (cached between runs).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: /tmp/fastembed_cache
          key: fastembed-${{ hashFiles('contextsmith/semantic.py') }}
      - run: python -m pip install -e ".[dev,semantic]"
      - run: pytest -q
        env:
          FASTEMBED_CACHE_PATH: /tmp/fastembed_cache
